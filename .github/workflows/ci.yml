name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Case-sensitivity import checks (Windows-safe, Linux-fatal)
        run: node scripts/check-imports.cjs

      - name: Validate Supabase seed SQL
        run: npm run validate:seed

      - name: Check local Supabase migration history
        run: npm run check:migrations -- --local-only

      - name: Link Supabase project for remote migration check
        if: ${{ github.event_name == 'push' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Check linked Supabase migration history
        if: ${{ github.event_name == 'push' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: npm run check:migrations

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build (matches Vercel's Turbopack build on Linux)
        run: npm run build
        env:
          # Public routes are dynamic, so the build does not require Supabase/SMTP/AI env vars.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
