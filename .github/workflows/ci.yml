name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Case-sensitivity import checks (Windows-safe, Linux-fatal)
        run: node scripts/check-imports.cjs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build (matches Vercel's Turbopack build on Linux)
        run: npm run build
        env:
          # Public routes are dynamic, so the build does not require Supabase/SMTP/AI env vars.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
